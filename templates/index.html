<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>my chatbot UI</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #0f172a;
    color: white;
    display: flex;
    height: 100vh;
}

/* Sidebar */
.sidebar {
    width: 250px;
    background: #020617;
    padding: 15px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid rgba(255,255,255,0.1);
}

.sidebar h2 {
    font-size: 18px;
    margin-bottom: 20px;
}

.new-chat {
    background: #2563eb;
    border: none;
    padding: 10px;
    border-radius: 10px;
    color: white;
    cursor: pointer;
    margin-bottom: 15px;
}

.history {
    flex: 1;
    overflow-y: auto;
}

.history div {
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
}

.history div:hover {
    background: rgba(59,130,246,0.2);
}

/* Main Chat */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* Header */
.header {
    padding: 15px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    text-align: center;
    font-size: 18px;
}

/* Chat Area */
#chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

/* Messages */
.message {
    max-width: 700px;
    margin: 10px auto;
    padding: 12px 15px;
    border-radius: 12px;
}

.user {
    background: #2563eb;
    text-align: right;
}

.bot {
    background: #1e293b;
}

/* Input */
.input-area {
    padding: 15px;
    border-top: 1px solid rgba(255,255,255,0.1);
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    outline: none;
    background: #1e293b;
    color: white;
}

button {
    padding: 10px 15px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    cursor: pointer;
}
</style>

</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <h2>💬 Chats</h2>
    <button class="new-chat" onclick="newChat()">+ New Chat</button>
    
    <div class="history" id="history"></div>
</div>

<!-- Main Chat -->
<div class="main">
    
    <div class="header">CHATBOT 💙</div>

    <div id="chat"></div>

    <div class="input-area">
        <input type="text" id="msg" placeholder="Ask anything...">
        <button onclick="send()">Send</button>
    </div>

</div>

<script>
let chats = [];
let currentChat = [];

function send() {
    let input = document.getElementById("msg");
    let chatBox = document.getElementById("chat");

    if (input.value.trim() === "") return;

    let msg = input.value;

    // User message
    let userDiv = document.createElement("div");
    userDiv.className = "message user";
    userDiv.innerText = msg;
    chatBox.appendChild(userDiv);

    currentChat.push("You: " + msg);

    // Bot reply
    let botDiv = document.createElement("div");
    botDiv.className = "message bot";
    botDiv.innerText = "Thinking...";
    chatBox.appendChild(botDiv);

    setTimeout(() => {
        botDiv.innerText = "This is AI response 🤖";
        currentChat.push("Bot: This is AI response 🤖");
        saveHistory();
    }, 800);

    input.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;
}

function newChat() {
    if (currentChat.length > 0) {
        chats.push([...currentChat]);
    }
    currentChat = [];
    document.getElementById("chat").innerHTML = "";
}

function saveHistory() {
    let history = document.getElementById("history");
    history.innerHTML = "";

    chats.forEach((chat, index) => {
        let item = document.createElement("div");
        item.innerText = chat[0];
        item.onclick = () => loadChat(index);
        history.appendChild(item);
    });
}

function loadChat(index) {
    let chatBox = document.getElementById("chat");
    chatBox.innerHTML = "";

    chats[index].forEach(msg => {
        let div = document.createElement("div");
        div.className = msg.startsWith("You") ? "message user" : "message bot";
        div.innerText = msg;
        chatBox.appendChild(div);
    });
}
</script>

</body>
</html>
