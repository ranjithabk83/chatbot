<!DOCTYPE html>
<html>
<head>
    <title>Chatbot</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            display: flex;
            background: #0f172a;
            color: white;
        }

        .history {
            width: 25%;
            height: 100vh;
            overflow-y: auto;
            background: rgba(255,255,255,0.05);
            padding: 10px;
        }

        .history-item {
            padding: 10px;
            margin: 5px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
        }

        .chat-container {
            width: 75%;
            display: flex;
            flex-direction: column;
        }

        #chat {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
        }

        .user-msg {
            background: blue;
            margin: 5px;
            padding: 10px;
            border-radius: 10px;
            text-align: right;
        }

        .bot-msg {
            background: gray;
            margin: 5px;
            padding: 10px;
            border-radius: 10px;
        }

        .input-area {
            display: flex;
            padding: 10px;
        }

        input {
            flex: 1;
            padding: 10px;
        }

        button {
            padding: 10px;
        }
    </style>
</head>

<body>

<div class="history" id="history">
    <h3>Saved Chats</h3>
</div>

<div class="chat-container">
    <div id="chat"></div>

    <div class="input-area">
        <input id="msg">
        <button onclick="send()">Send</button>
    </div>
</div>

<script>
function addMessage(text, sender) {
    const chat = document.getElementById("chat");

    const div = document.createElement("div");
    div.className = sender === "user" ? "user-msg" : "bot-msg";
    div.innerHTML = text;

    chat.appendChild(div);
}

// LOAD FROM DATABASE
async function loadHistory() {
    const res = await fetch("/history");
    const data = await res.json();

    const history = document.getElementById("history");

    data.forEach(item => {
        const div = document.createElement("div");
        div.className = "history-item";
        div.innerText = item[0].substring(0, 30);

        history.appendChild(div);
    });
}

// SEND MESSAGE
async function send() {
    const input = document.getElementById("msg");
    const message = input.value;

    if (!message) return;

    addMessage(message, "user");
    input.value = "";

    const res = await fetch("/ask", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: message})
    });

    const data = await res.json();
    addMessage(data.response, "bot");
}

// LOAD ON START
loadHistory();
</script>

</body>
</html>
